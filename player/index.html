<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escoria JS</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; image-rendering: pixelated; cursor: crosshair; }
  #msg { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; color: #aaa; font: 16px system-ui, sans-serif; pointer-events: none; transition: opacity .2s; }
  #msg.hidden { opacity: 0; }
  #msg.over { background: rgba(0, 0, 0, .35); }
  #msg .spin { width: 36px; height: 36px; border: 4px solid rgba(255, 255, 255, .2); border-top-color: #ddd; border-radius: 50%; animation: spin .8s linear infinite; }
  #msg.error .spin { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="msg"><div class="spin"></div><div class="text">Loading…</div></div>
<script type="module" src="player.js"></script>
</body>
</html>
