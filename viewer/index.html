<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room viewer</title>
<style>
  :root { color-scheme: dark; --bg: #16161a; --panel: #222228; --text: #ddd; --dim: #888; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 12px; background: var(--panel); }
  header label { display: flex; gap: 4px; align-items: center; }
  select, input[type=text] { background: #111; color: var(--text); border: 1px solid #444; padding: 2px 4px; }
  button { background: #333; color: var(--text); border: 1px solid #555; padding: 2px 8px; cursor: pointer; }
  button:hover { background: #444; }
  main { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  #wrap { flex: 1; min-width: 0; }
  canvas { width: 100%; height: auto; display: block; background: #000; image-rendering: pixelated; cursor: crosshair; }
  #status, #mode { margin-top: 6px; color: var(--dim); font-family: ui-monospace, monospace; min-height: 1.4em; }
  #status b { color: var(--text); }
  #scroll { width: 100%; }
  aside { width: 280px; flex: none; background: var(--panel); padding: 8px; max-height: calc(100vh - 80px); overflow: auto; }
  aside h3 { margin: 12px 0 6px; font-size: 13px; }
  aside h3:first-child { margin-top: 4px; }
  aside .item { display: flex; justify-content: space-between; gap: 6px; margin: 3px 0; }
  aside .item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #evlist, #dialog { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #dialog { flex-direction: column; }
  #dialog button { text-align: left; background: #2a3550; }
  #error { color: #f77; white-space: pre-wrap; }
  #logbox { margin-top: 8px; }
  #logbox summary label { margin-left: 10px; font-size: 12px; }
  #logbox button { font-size: 11px; margin-left: 6px; }
  #log { background: #0c0c0f; padding: 6px 8px; max-height: 320px; overflow: auto; font: 12px ui-monospace, monospace; white-space: pre-wrap; margin: 4px 0 0; }
  #log .warn { color: #fb5; }
  #log .error { color: #f77; }
  #log .event { color: #6cf; }
  #log .command { color: #999; }
  #log .global { color: #777; }
  #log .say { color: #fff; }
  @media (max-width: 800px) { main { flex-direction: column; } aside { width: auto; } }
</style>
</head>
<body>
<header>
  <label>Game <select id="game"></select></label>
  <label>Room <select id="room"></select></label>
  <button id="newgame">New game</button>
  <label><input type="checkbox" id="nav"> Walkable</label>
  <label><input type="checkbox" id="col"> Collisions</label>
  <label><input type="checkbox" id="loc"> Locations</label>
  <label><input type="checkbox" id="names"> Names</label>
  <label><input type="checkbox" id="anim" checked> Animate</label>
  <label><input type="checkbox" id="walk" checked> Clicks to the game</label>
  <label><input type="checkbox" id="path"> Path</label>
</header>
<main>
  <div id="wrap">
    <canvas id="screen"></canvas>
    <input type="range" id="scroll" min="0" max="0" value="0" hidden>
    <div id="mode"></div>
    <div id="status"></div>
    <div id="error"></div>
    <details id="logbox" open>
      <summary>Console <button id="logcopy">Copy</button> <button id="logclear">Clear</button>
        <label><input type="checkbox" id="logcmd" checked> commands</label>
        <label><input type="checkbox" id="logglobal"> globals</label></summary>
      <pre id="log"></pre>
    </details>
  </div>
  <aside>
    <h3>Events</h3>
    <select id="evobj"></select>
    <div id="evlist"></div>
    <h3>Object states</h3>
    <div id="states"></div>
  </aside>
</main>
<script type="module" src="viewer.js"></script>
</body>
</html>
